# .github/workflows/publish.yml
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"   # Trigger on tags like v1.0.0, v1.1.0

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi   # Optional: gate the publish job behind a GitHub environment
    permissions:
      id-token: write   # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No password: uses OIDC (Trusted Publishing) configured at
        # https://pypi.org/manage/project/deepsim-dskit/settings/publishing/